name: Trigger Downstream Docker Builds

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  trigger-downstream:
    runs-on: ubuntu-latest
    if: vars.DOWNSTREAM_DOCKER_REPOS != '' && vars.DOWNSTREAM_DOCKER_REPOS != ' '
    steps:
      - name: Trigger downstream repositories
        env:
          GH_TOKEN: ${{ secrets.GH_TRIGGER_TOKEN }}
          DOWNSTREAM_REPOS: ${{ vars.DOWNSTREAM_DOCKER_REPOS }}
          EVENT_TYPE: ${{ vars.DOWNSTREAM_DISPATCH_EVENT || 'base-updated' }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Error: GH_TRIGGER_TOKEN secret is not set." >&2
            exit 1
          fi

          for repo in $DOWNSTREAM_REPOS; do
            echo "Triggering dispatch event '${EVENT_TYPE}' for $repo..."
            gh api --method POST \
              "repos/$repo/dispatches" \
              -f event_type="${EVENT_TYPE}"
          done
